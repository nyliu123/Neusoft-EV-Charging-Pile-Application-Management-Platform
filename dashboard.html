<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>电动汽车充电桩运营数据大屏</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: rgba(12, 31, 53, .9);
      --line: rgba(84, 179, 255, .24);
      --text: #eaf7ff;
      --muted: #8fb2c9;
      --cyan: #40d9ff;
      --green: #4ce0a1;
      --orange: #ffb85c;
      --red: #ff7185;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 50% -20%, rgba(28, 125, 190, .3), transparent 42%),
        linear-gradient(160deg, #06101c 0%, #081b2b 55%, #06111f 100%);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .14;
      background-image: linear-gradient(rgba(95, 193, 255, .16) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(95, 193, 255, .16) 1px, transparent 1px);
      background-size: 42px 42px;
    }
    .shell { position: relative; max-width: 1800px; margin: 0 auto; padding: 20px 24px 30px; }
    header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; margin-bottom: 18px; }
    h1 { margin: 0; text-align: center; font-size: clamp(24px, 2.2vw, 40px); letter-spacing: .12em; text-shadow: 0 0 24px rgba(64, 217, 255, .45); }
    .subtitle, .clock { color: var(--muted); font-size: 14px; }
    .clock { text-align: right; }
    .toolbar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-bottom: 14px; }
    .notice { margin-right: auto; color: var(--orange); font-size: 13px; }
    button { border: 1px solid rgba(64, 217, 255, .55); border-radius: 7px; padding: 8px 14px; color: var(--text); background: rgba(25, 101, 145, .35); cursor: pointer; }
    button:hover { background: rgba(40, 154, 207, .52); }
    button:disabled { opacity: .45; cursor: wait; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 14px; }
    .card, .panel { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); box-shadow: inset 0 0 28px rgba(26, 123, 180, .08), 0 12px 32px rgba(0, 0, 0, .18); }
    .card { min-height: 112px; padding: 18px 20px; position: relative; overflow: hidden; }
    .card::after { content: ""; position: absolute; right: -22px; bottom: -36px; width: 100px; height: 100px; border-radius: 50%; background: rgba(64, 217, 255, .08); }
    .card-label { color: var(--muted); font-size: 14px; }
    .card-value { margin-top: 12px; font-size: clamp(24px, 2vw, 35px); font-weight: 700; color: var(--cyan); }
    .card-unit { margin-left: 5px; color: var(--muted); font-size: 13px; font-weight: 400; }
    .grid { display: grid; grid-template-columns: 1.55fr 1fr; grid-template-rows: 380px 360px; gap: 14px; }
    .panel { min-width: 0; padding: 14px 14px 8px; }
    .panel-title { height: 32px; padding-left: 11px; border-left: 3px solid var(--cyan); font-size: 16px; line-height: 24px; }
    .chart { width: 100%; height: calc(100% - 32px); }
    .error { display: none; margin: 18px 0; padding: 12px 15px; border: 1px solid rgba(255, 113, 133, .5); border-radius: 8px; color: #ffdbe0; background: rgba(130, 28, 47, .25); }
    footer { margin-top: 12px; color: #6f93aa; text-align: center; font-size: 12px; }
    @media (max-width: 980px) {
      header { grid-template-columns: 1fr; text-align: center; }
      .clock { text-align: center; }
      .cards { grid-template-columns: repeat(2, 1fr); }
      .grid { grid-template-columns: 1fr; grid-template-rows: repeat(4, 360px); }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="subtitle">BIT · NEUSOFT EV CHARGING PLATFORM</div>
      <h1>电动汽车充电桩运营数据大屏</h1>
      <div class="clock" id="clock">--</div>
    </header>
    <div class="toolbar">
      <div class="notice" id="notice">教学演示数据，不代表真实运营结果</div>
      <button id="generate">生成 30 天演示数据</button>
      <button id="refresh">刷新数据</button>
    </div>
    <div class="error" id="error"></div>
    <section class="cards">
      <article class="card"><div class="card-label">近 30 天订单</div><div class="card-value" id="orders">--<span class="card-unit">单</span></div></article>
      <article class="card"><div class="card-label">近 30 天充电量</div><div class="card-value" id="energy">--<span class="card-unit">kWh</span></div></article>
      <article class="card"><div class="card-label">近 30 天营收</div><div class="card-value" id="revenue">--<span class="card-unit">元</span></div></article>
      <article class="card"><div class="card-label">接入充电桩</div><div class="card-value" id="chargers">--<span class="card-unit">台</span></div></article>
    </section>
    <section class="grid">
      <article class="panel"><div class="panel-title">30 日经营趋势</div><div id="trend" class="chart"></div></article>
      <article class="panel"><div class="panel-title">充电桩状态分布</div><div id="status" class="chart"></div></article>
      <article class="panel"><div class="panel-title">站点营收排行</div><div id="ranking" class="chart"></div></article>
      <article class="panel"><div class="panel-title">故障上报趋势</div><div id="fault" class="chart"></div></article>
    </section>
    <footer>数据通过本地 HTTP 桥接服务从 Qt TCP 服务端实时读取 · 页面每 30 秒自动刷新</footer>
  </main>
  <script src="echarts.min.js"></script>
  <script>
    const colors = { cyan: '#40d9ff', green: '#4ce0a1', orange: '#ffb85c', red: '#ff7185', text: '#d9efff', muted: '#789bb3', grid: 'rgba(110,180,220,.14)' };
    const charts = {
      trend: echarts.init(document.getElementById('trend')),
      status: echarts.init(document.getElementById('status')),
      ranking: echarts.init(document.getElementById('ranking')),
      fault: echarts.init(document.getElementById('fault'))
    };
    const statusNames = { idle: '空闲', reserved: '已预约', charging: '充电中', fault: '故障', offline: '离线', disabled: '停用' };
    const axis = { axisLine: { lineStyle: { color: colors.grid } }, axisLabel: { color: colors.muted }, splitLine: { lineStyle: { color: colors.grid } } };

    function number(value, digits = 0) { return Number(value || 0).toLocaleString('zh-CN', { minimumFractionDigits: digits, maximumFractionDigits: digits }); }
    function setCard(id, value, unit) { document.getElementById(id).innerHTML = `${value}<span class="card-unit">${unit}</span>`; }
    function showError(message = '') { const box = document.getElementById('error'); box.textContent = message; box.style.display = message ? 'block' : 'none'; }

    function render(data) {
      const summary = data.summary || {};
      const daily = data.dailyTrend || [];
      const stations = data.stationRanking || [];
      const statuses = data.chargerStatuses || [];
      const faults = data.faultTrend || [];
      document.getElementById('notice').textContent = data.dataNotice || '教学演示数据，不代表真实运营结果';
      setCard('orders', number(summary.orderCount), '单');
      setCard('energy', number((summary.energyWh || 0) / 1000, 1), 'kWh');
      setCard('revenue', number((summary.revenueCents || 0) / 100, 2), '元');
      setCard('chargers', number(summary.chargerCount), '台');

      charts.trend.setOption({
        color: [colors.cyan, colors.orange, colors.green],
        tooltip: { trigger: 'axis' },
        legend: { top: 0, textStyle: { color: colors.text }, data: ['订单数', '营收', '充电量'] },
        grid: { left: 55, right: 60, top: 48, bottom: 38 },
        xAxis: { type: 'category', data: daily.map(x => x.date.slice(5)), ...axis },
        yAxis: [
          { type: 'value', name: '订单/电量', nameTextStyle: { color: colors.muted }, ...axis },
          { type: 'value', name: '营收/元', nameTextStyle: { color: colors.muted }, ...axis }
        ],
        series: [
          { name: '订单数', type: 'bar', barMaxWidth: 13, data: daily.map(x => x.orderCount), itemStyle: { borderRadius: [3, 3, 0, 0] } },
          { name: '营收', type: 'line', yAxisIndex: 1, smooth: true, symbol: 'none', lineStyle: { width: 3 }, areaStyle: { opacity: .08 }, data: daily.map(x => (x.revenueCents / 100).toFixed(2)) },
          { name: '充电量', type: 'line', smooth: true, symbol: 'none', data: daily.map(x => (x.energyWh / 1000).toFixed(2)) }
        ]
      });
      charts.status.setOption({
        color: [colors.green, colors.orange, colors.cyan, colors.red, '#7788aa', '#a774d6'],
        tooltip: { trigger: 'item' },
        legend: { bottom: 8, textStyle: { color: colors.text } },
        series: [{ type: 'pie', radius: ['45%', '70%'], center: ['50%', '43%'], label: { color: colors.text, formatter: '{b}\n{c} 台' },
          data: statuses.map(x => ({ name: statusNames[x.status] || x.status, value: x.count })) }]
      });
      charts.ranking.setOption({
        color: [colors.cyan], tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
        grid: { left: 135, right: 45, top: 18, bottom: 35 },
        xAxis: { type: 'value', name: '营收/元', nameTextStyle: { color: colors.muted }, ...axis },
        yAxis: { type: 'category', inverse: true, data: stations.map(x => x.stationName), ...axis },
        series: [{ type: 'bar', barMaxWidth: 22, data: stations.map(x => (x.revenueCents / 100).toFixed(2)), itemStyle: { borderRadius: [0, 5, 5, 0], color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [{ offset: 0, color: '#1979af' }, { offset: 1, color: colors.cyan }]) } }]
      });
      charts.fault.setOption({
        color: [colors.red], tooltip: { trigger: 'axis' }, grid: { left: 50, right: 25, top: 25, bottom: 38 },
        xAxis: { type: 'category', data: faults.map(x => x.date.slice(5)), ...axis },
        yAxis: { type: 'value', minInterval: 1, ...axis },
        series: [{ name: '故障数', type: 'line', smooth: true, symbolSize: 6, data: faults.map(x => x.count), areaStyle: { opacity: .14 }, lineStyle: { width: 3 } }]
      });
    }

    async function refresh() {
      const button = document.getElementById('refresh');
      button.disabled = true; showError();
      try {
        const response = await fetch('/api/dashboard', { cache: 'no-store' });
        const body = await response.json();
        if (!response.ok || !body.ok) throw new Error(body.message || `HTTP ${response.status}`);
        render(body.data);
      } catch (error) { showError(`无法读取运营数据：${error.message}`); }
      finally { button.disabled = false; }
    }

    document.getElementById('refresh').addEventListener('click', refresh);
    document.getElementById('generate').addEventListener('click', async () => {
      if (!confirm('将向数据库写入可重复的 30 天教学演示订单。确定继续吗？')) return;
      const button = document.getElementById('generate'); button.disabled = true; showError();
      try {
        const response = await fetch('/api/generate-demo', { method: 'POST' });
        const body = await response.json();
        if (!response.ok || !body.ok) throw new Error(body.message || `HTTP ${response.status}`);
        alert(`完成：新增 ${body.data.insertedOrders} 条演示订单。重复执行不会重复写入。`);
        await refresh();
      } catch (error) { showError(`生成演示数据失败：${error.message}`); }
      finally { button.disabled = false; }
    });
    window.addEventListener('resize', () => Object.values(charts).forEach(chart => chart.resize()));
    function updateClock() { document.getElementById('clock').textContent = new Date().toLocaleString('zh-CN', { hour12: false }); }
    updateClock();
    setInterval(updateClock, 1000);
    setInterval(refresh, 30000);
    refresh();
  </script>
</body>
</html>
